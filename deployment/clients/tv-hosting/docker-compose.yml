services:
  absorflix-tv-downloads:
    image: nginx@sha256:dc5069ad14f19660b141b21236140b91656bf89bbc3e2417c70ae650cd66104c
    container_name: absorflix-tv-downloads
    restart: unless-stopped
    user: "101:101"
    entrypoint: ["nginx"]
    command: ["-g", "daemon off;"]
    read_only: true
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
    tmpfs:
      - /tmp:rw,noexec,nosuid,size=32m,mode=1777
    ports:
      - "127.0.0.1:18967:8080"
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf:ro
      - ${ABSORFLIX_TV_DIRECTORY:-/mnt/user/system/docker-compose/jellyfin_new/absorflix/releases/10.11.6-108a3928/web/absorflix/tv}:/downloads:ro
